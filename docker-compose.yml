services:
  db:
    image: postgres:16.0-alpine
    container_name: postgres
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"
    networks:
      - app_network
    env_file:
      - ./.env.config_compose

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    depends_on:
    - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin/data/
      - pgadmin_volume:/var/lib/pgadmin/
    ports:
      - "5050:80"
    networks:
      - app_network
    env_file:
      - ./.env.config_compose

  web:
    environment:
      - ENVIRONMENT=docker
    build: .
    container_name: fastapi
    restart: always
    depends_on:
      - db
    ports:
      - 8000:8000
    networks:
      - app_network

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  pgadmin_volume:
