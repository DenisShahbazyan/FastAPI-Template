services:
  db:
    image: postgres:16.0-alpine
    container_name: postgres
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "16872:5432"
    networks:
      - app_network
    env_file:
      - .env.docker

  web:
    image: ${DOCKER_USERNAME}/fastapi_template:latest
    container_name: fastapi
    restart: always
    depends_on:
      - db
    expose:
      - "8000"
    networks:
      - app_network
    env_file:
      - .env.docker

  caddy:
    image: caddy:2.11.1-alpine
    container_name: caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    env_file:
      - .env.docker
    depends_on:
      - web
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
