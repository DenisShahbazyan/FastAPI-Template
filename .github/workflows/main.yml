name: CI for FastAPI Template

on:
  push:
    branches: [master]

jobs:
  copy_infra_to_server:
    name: Copy docker-compose.yml and nginx.conf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Create projects directory
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            sudo rm -rf /home/${{ secrets.SERVER_USER }}/fastapi_template/
            mkdir -p /home/${{ secrets.SERVER_USER }}/fastapi_template/

      - name: Prepare files for transfer
        run: |
          mkdir transfer
          cp -r nginx transfer/
          cp docker-compose.yml .env.config_compose .env.docker transfer/

      - name: Copy files
        uses: garygrossgarten/github-action-scp@release
        with:
          local: "transfer/"
          remote: /home/${{ secrets.SERVER_USER }}/fastapi_template/
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          privateKey: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}

  build_and_push_backend_to_docker_hub:
    name: Push backend Docker image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to Docker
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push backend to Docker Hub
        uses: docker/build-push-action@v2
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/fastapi_template:latest

  deploy:
    runs-on: ubuntu-latest
    needs: [copy_infra_to_server, build_and_push_backend_to_docker_hub]
    if: github.ref == 'refs/heads/master'
    steps:
      - name: executing remote ssh commands to deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            cd /home/${{ secrets.SERVER_USER }}/fastapi_template/

            chmod +x /home/${{ secrets.SERVER_USER }}/fastapi_template/nginx/start.sh

            echo "${{ secrets.DOCKER_PASSWORD }}" | sudo docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            sudo docker-compose down
            sudo docker rm -f fastapi
            sudo docker rmi -f ${{ secrets.DOCKER_USERNAME }}/fastapi_template

            sudo docker-compose up -d
