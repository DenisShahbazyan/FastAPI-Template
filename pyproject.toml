##########################################
#                  Ruff                  #
##########################################
[tool.ruff]
exclude = [
    # Ruff standard
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    # MyFiles
    "__pycache__/*",
    "alembic/*",
]

# Same as Black.
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "C",   # mccabe
    "N",   # pep8-naming
    "I",   # isort
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "PIE", # flake8-pie
    "Q",   # flake8-quotes
]
ignore = []

# Настройки flake8-quotes
[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"

# # Настройки форматирования (замена black)
[tool.ruff.format]
quote-style = "single"
docstring-code-format = true
docstring-code-line-length = "dynamic"


##########################################
#                   Ty                   #
##########################################
[tool.ty.rules]
invalid-argument-type = "ignore"

[[tool.ty.overrides]]
include = ["app/crud/_base.py"]

[tool.ty.overrides.rules]
possibly-missing-attribute = "ignore"
unresolved-attribute = "ignore"

[tool.ty.src]
exclude = ["tests/**"]

##########################################
#                 PyTest                 #
##########################################
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [".", "app"]
filterwarnings = ["ignore::DeprecationWarning"]


##########################################
#                   UV                   #
##########################################
[project]
name = "fastapi-template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14.3"
dependencies = [
    "alembic>=1.18.3",
    "asyncpg>=0.31.0",
    "fastapi-users[sqlalchemy]>=15.0.4",
    "fastapi[standard]>=0.128.1",
    "granian>=2.7.2",
    "orjson>=3.11.7",
    "pydantic-settings>=2.12.0",
    "sqlalchemy>=2.0.46",
]

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.14.3",
    "ty>=0.0.15",
]
